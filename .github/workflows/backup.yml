name: Backup

# Nightly copy of the business tools' data to Google Drive, outside Vercel and Neon:
#
#   wfinew-backups/database/YYYY-MM-DD/wfinew.sql   full database (restore with psql)
#   wfinew-backups/database/YYYY-MM-DD/<table>.csv  each table, to open in Sheets
#   wfinew-backups/receipts/<year>/...             receipt photos and PDFs, by date and vendor
#
# Database copies are kept for 30 days, plus the first of each month for 7 years (the
# CRA asks for 6). Receipts are only ever added: one deleted on the site stays here.
#
# This repo is public, so anyone can read this workflow's logs. Never print database
# rows, receipt details or connection strings; scripts/backup-receipts.mjs prints counts.
#
# Secrets: DATABASE_URL (the Neon connection string), BLOB_READ_WRITE_TOKEN (the
# blob-wfinew store) and RCLONE_CONFIG (rclone.conf with a [gdrive] remote, scope
# drive.file). See docs/business-tools.md → Backups.

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC: 2 a.m. Toronto in winter, 3 a.m. in summer
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      REMOTE: gdrive:wfinew-backups
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      # pg_dump must be at least as new as the server (Postgres 18); Ubuntu ships 16
      - name: Install Postgres 18 client and rclone
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18 rclone > /dev/null
          pg_dump --version

      - name: Configure Google Drive
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > ~/.config/rclone/rclone.conf
          rclone lsd gdrive: > /dev/null

      - name: Back up the database
        run: |
          # pg_dump needs a direct connection, not Neon's connection pooler
          DIRECT="${DATABASE_URL/-pooler./.}"
          echo "::add-mask::$DIRECT"
          DAY=$(TZ=America/Toronto date +%F)
          mkdir -p out/database
          pg_dump "$DIRECT" --no-owner --no-privileges --format=plain --file out/database/wfinew.sql
          for table in $(psql "$DIRECT" -At -c "SELECT table_schema || '.' || table_name FROM information_schema.tables WHERE table_schema IN ('public', 'drizzle') AND table_type = 'BASE TABLE' ORDER BY 1"); do
            name=${table#public.}
            psql "$DIRECT" -q -c "\copy (SELECT * FROM $table ORDER BY 1) TO 'out/database/${name}.csv' WITH CSV HEADER"
          done
          echo "Database: $(ls out/database | wc -l) files, $(du -sh out/database | cut -f1)"
          rclone copy out/database "$REMOTE/database/$DAY"

      - name: Back up new receipts
        run: |
          mkdir -p out/receipts
          rclone lsf -R --files-only "$REMOTE/receipts" > out/existing-receipts.txt 2>/dev/null || true
          node scripts/backup-receipts.mjs out/receipts out/existing-receipts.txt
          rclone copy out/receipts "$REMOTE/receipts"

      - name: Remove old database copies
        run: |
          # Keep the last 30 days, and the earliest copy of each month for 7 years
          RECENT=$(TZ=America/Toronto date -d '30 days ago' +%F)
          OLDEST=$(TZ=America/Toronto date -d '7 years ago' +%F)
          seen_months=" "
          removed=0
          for dir in $(rclone lsf --dirs-only "$REMOTE/database" | sort); do
            day=${dir%/}
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || continue
            month=${day:0:7}
            first_of_month=false
            [[ "$seen_months" != *" $month "* ]] && first_of_month=true && seen_months+="$month "
            if [[ "$day" < "$RECENT" ]] && { [[ "$first_of_month" == false ]] || [[ "$day" < "$OLDEST" ]]; }; then
              rclone purge "$REMOTE/database/$day"
              removed=$((removed + 1))
            fi
          done
          echo "Removed $removed old database copies."
